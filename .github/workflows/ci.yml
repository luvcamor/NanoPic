name: NanoPic CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      # actions 按 commit SHA 固定（防可变 tag 供应链劫持）；升级由 Dependabot 跟进。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Verify embedded libwebp binaries against official release
        shell: pwsh
        run: |
          $codecSource = Get-Content src/NanoPic.Codecs/LibWebpTools.cs -Raw
          $url = [regex]::Match($codecSource, 'SourceUrl = "([^"]+)"').Groups[1].Value
          $archiveSha256 = [regex]::Match($codecSource, 'ArchiveSha256 = "([0-9A-Fa-f]+)"').Groups[1].Value
          if (-not $url -or -not $archiveSha256) { throw 'Unable to read libwebp source url or archive hash from LibWebpTools.cs.' }

          $zipPath = Join-Path $env:RUNNER_TEMP 'libwebp-official.zip'
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          $actualArchiveSha256 = (Get-FileHash $zipPath -Algorithm SHA256).Hash
          if ($actualArchiveSha256 -ne $archiveSha256) { throw "Official libwebp archive hash mismatch: $actualArchiveSha256 (expected $archiveSha256)." }

          $expectedToolHashes = @{
            'cwebp.exe' = [regex]::Match($codecSource, 'CwebpSha256 = "([0-9A-Fa-f]+)"').Groups[1].Value
            'dwebp.exe' = [regex]::Match($codecSource, 'DwebpSha256 = "([0-9A-Fa-f]+)"').Groups[1].Value
          }
          foreach ($name in $expectedToolHashes.Keys) {
            if (-not $expectedToolHashes[$name]) { throw "Unable to read $name hash from LibWebpTools.cs." }
          }

          # 校验官方 zip 内的工具与代码常量一致，再校验仓库提交的二进制与官方 zip 一致。
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            foreach ($name in $expectedToolHashes.Keys) {
              $entry = $archive.Entries | Where-Object { $_.Name -eq $name }
              if (-not $entry) { throw "Official archive does not contain $name." }
              $entryStream = $entry.Open()
              try {
                $sha256 = [Security.Cryptography.SHA256]::Create()
                $actual = ([BitConverter]::ToString($sha256.ComputeHash($entryStream)) -replace '-', '')
              } finally { $entryStream.Dispose() }
              if ($actual -ne $expectedToolHashes[$name]) { throw "Official $name hash mismatch: $actual (expected $($expectedToolHashes[$name]))." }
            }
          } finally { $archive.Dispose() }

          foreach ($name in $expectedToolHashes.Keys) {
            $committed = (Get-FileHash "src/NanoPic.Codecs/Native/libwebp-1.6.0/$name" -Algorithm SHA256).Hash
            if ($committed -ne $expectedToolHashes[$name]) { throw "Committed $name does not match the official libwebp release." }
          }

          Write-Host 'Embedded libwebp binaries match the official release.'

      - name: Build and publish net48 single-executable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/security-reports | Out-Null
          ./build/Publish-NanoPic.ps1 -Configuration Release -RuntimeIdentifier win-x64

      - name: Audit NuGet vulnerabilities
        shell: pwsh
        run: |
          $report = dotnet list NanoPic.sln package --vulnerable --include-transitive --format json --no-restore | Out-String
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability audit failed to run.' }
          Set-Content -LiteralPath artifacts/security-reports/nuget-vulnerabilities.json -Value $report -Encoding utf8
          if ($report -match '"vulnerabilities"\s*:') { throw 'NuGet vulnerability audit found one or more vulnerable packages.' }

      - name: Verify publish layout and size gate
        shell: pwsh
        run: |
          $required = @(
            'artifacts/publish/win-x64/NanoPic.exe',
            'artifacts/publish/win-x64/NanoPic.exe.sha256',
            'artifacts/publish/win-x64/LICENSE',
            'artifacts/publish/win-x64/THIRD-PARTY-NOTICES.txt',
            'artifacts/publish/win-x64/licenses/BSD-3-CLAUSE-LIBWEBP.txt',
            'artifacts/publish/win-x64/licenses/MIT-MANAGED-DEPENDENCIES.txt',
            'artifacts/publish/win-x64/licenses/README.md',
            'artifacts/publish/win-x64/SBOM.spdx.json',
            'artifacts/publish/win-x64/manifest.json'
          )
          $missing = $required | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) { throw "Missing release assets: $($missing -join ', ')" }
          $size = (Get-Item -LiteralPath 'artifacts/publish/win-x64/NanoPic.exe').Length
          if ($size -ge 2000000) { throw "FAILED-SIZE-GATE: NanoPic.exe is $size bytes; expected < 2,000,000 B." }
          $expected = (Get-Content 'artifacts/publish/win-x64/NanoPic.exe.sha256' -Raw).Split(' ')[0]
          $actual = (Get-FileHash 'artifacts/publish/win-x64/NanoPic.exe' -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'NanoPic.exe hash does not match NanoPic.exe.sha256.' }
          $manifest = Get-Content 'artifacts/publish/win-x64/manifest.json' -Raw | ConvertFrom-Json
          $executable = (Resolve-Path 'artifacts/publish/win-x64/NanoPic.exe').Path
          $productVersion = (Get-Item -LiteralPath $executable).VersionInfo.ProductVersion.Split('+')[0]
          $assemblyVersion = [Reflection.AssemblyName]::GetAssemblyName($executable).Version.ToString()
          if ($manifest.product.version -ne $productVersion) { throw 'Manifest product version does not match NanoPic.exe.' }
          if ($manifest.product.assemblyVersion -ne $assemblyVersion) { throw 'Manifest assembly version does not match NanoPic.exe.' }
          if ($manifest.product.targetFramework -ne 'net48') { throw 'Manifest target framework is not net48.' }
          if ($manifest.product.selfContained -ne $false) { throw 'Manifest incorrectly declares a self-contained .NET runtime.' }
          if ($manifest.product.codecBackend -ne 'Windows WIC + libwebp 1.6.0') { throw 'Manifest codec backend is incorrect.' }
          if ($manifest.primaryArtifact.sizeBytes -ne $size) { throw 'Manifest size does not match NanoPic.exe.' }
          if ($manifest.primaryArtifact.sha256 -ne $actual) { throw 'Manifest hash does not match NanoPic.exe.' }
          $sbom = Get-Content 'artifacts/publish/win-x64/SBOM.spdx.json' -Raw | ConvertFrom-Json
          if ($sbom.packages[0].versionInfo -ne $productVersion) { throw 'SBOM application version does not match NanoPic.exe.' }
          if ('libwebp' -notin @($sbom.packages.name)) { throw 'SBOM does not contain libwebp.' }
          if ('System.Text.Json' -notin @($sbom.packages.name)) { throw 'SBOM does not contain managed runtime dependencies.' }
          $forbidden = @(Get-ChildItem 'artifacts/publish/win-x64' -File | Where-Object {
            $_.Extension -in @('.dll', '.pdb', '.config') -or $_.Name -match 'Magick|ImageMagick'
          })
          if ($forbidden.Count -ne 0) { throw "Forbidden runtime files: $($forbidden.Name -join ', ')" }

      - name: Upload release audit bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NanoPic-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error

      - name: Upload security reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NanoPic-security-reports
          path: artifacts/security-reports
          if-no-files-found: error
